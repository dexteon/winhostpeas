# Copy of the shared gitleaks config (custom rules for CI). Edit the source and re-copy; repo-specific allowlists go at the bottom.
# Global gitleaks config (gitleaks v8.30.1).
# Found by the hook through the GITLEAKS_CONFIG environment variable (set at user level on Windows and in WSL ~/.profile).
# Go RE2 regex: no lookahead or lookbehind. Multi-line anchors need (?m).

title = "DexLab global gitleaks config"

[extend]
# Keep every built-in rule; the rules below are added on top.
useDefault = true

# ---------------------------------------------------------------------------
# Custom rules for known secret formats
# ---------------------------------------------------------------------------

[[rules]]
id = "dex-sk-prefixed-key"
description = "Anthropic/OpenAI-style sk- key (sk- plus 20 or more chars)"
regex = '''(?:^|[^A-Za-z0-9_-])(sk-[A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["sk-"]

[[rules]]
id = "dex-aws-access-key-id"
description = "AWS access key id (AKIA + 16)"
regex = '''\b(AKIA[0-9A-Z]{16})\b'''
secretGroup = 1
keywords = ["akia"]

[[rules]]
id = "dex-github-token"
description = "GitHub token (ghp_, gho_, ghu_, ghs_, ghr_)"
regex = '''\b(gh[pousr]_[A-Za-z0-9]{36,255})\b'''
secretGroup = 1
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "dex-jwt"
description = "JSON Web Token (three base64url segments, eyJ header)"
regex = '''\b(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})'''
secretGroup = 1
keywords = ["eyj"]

[[rules]]
id = "dex-telegram-bot-token"
description = "Telegram bot token (8-10 digit bot id, colon, 35 chars)"
# Spec anchors the whole line (^...$). Unanchored here so TOKEN=<value> and quoted values also match,
# with non-token boundaries on both sides instead.
regex = '''(?:^|[^0-9A-Za-z])([0-9]{8,10}:[A-Za-z0-9_-]{35})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
keywords = [":"]

[[rules]]
id = "dex-zeek-credential"
description = "Zeek credential (ZEEK_ plus 20 or more base64 chars)"
regex = '''(ZEEK_[A-Za-z0-9+/=]{20,})'''
secretGroup = 1
keywords = ["zeek_"]

[[rules]]
id = "dex-env-pair"
description = ".env-style KEY=value pair with a value of 8 or more non-space chars"
# Spec regex used a (?!\s*$) lookahead; RE2 has none, and \S{8,} already rules out an empty value.
regex = '''(?m)^([A-Z_][A-Z0-9_]*)=(\S{8,})$'''
secretGroup = 2
entropy = 3.0
keywords = ["="]

  [[rules.allowlists]]
  description = "Common non-secret environment keys"
  regexTarget = "match"
  regexes = [
    '''^(PATH|HOME|SHELL|LANG|LANGUAGE|LC_[A-Z]+|PWD|OLDPWD|USER|USERNAME|LOGNAME|TERM|TERM_PROGRAM|TZ|EDITOR|VISUAL|PAGER|HOSTNAME|DISPLAY|TMPDIR|TEMP|TMP|XDG_[A-Z_]+|PYTHONPATH|NODE_ENV|NODE_OPTIONS|GOPATH|JAVA_HOME|VIRTUAL_ENV|COMPOSE_PROJECT_NAME|LOG_LEVEL|ENVIRONMENT|APP_ENV|PORT|HOST|TZDATA|DEBIAN_FRONTEND|PYTHONUNBUFFERED|PYTHONDONTWRITEBYTECODE)=''',
  ]

  [[rules.allowlists]]
  description = "Placeholder and reference values, not literal secrets"
  regexTarget = "secret"
  regexes = [
    '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',
    '''^<[^>]+>$''',
    '''(?i)^(changeme|change_me|your[_-].*|xxx+|placeholder|redacted|none|null|true|false)$''',
    '''^(https?|file)://[^@\s]*$''',
  ]

# ---------------------------------------------------------------------------
# Global allowlists
# ---------------------------------------------------------------------------

[[allowlists]]
description = "Synthetic test secrets: an EXAMPLE or SYNTHETIC marker inside a test fixture path"
# AND: both must hold, so a synthetic marker outside a fixture path still blocks (this is what the
# scratch-repo proof relies on), and a real secret pasted into a fixture path still blocks.
condition = "AND"
regexTarget = "match"
regexes = ['''(?i)(EXAMPLE|SYNTHETIC|FAKE_?SECRET|DUMMY)''']
paths = [
  '''(?i)(^|/)(tests?|__tests__|testdata|test_data|fixtures?|__fixtures__|spec|mocks?)/''',
  '''(?i)(^|/)[^/]*\.(test|spec)\.[A-Za-z0-9]+$''',
  '''(?i)(^|/)test_[^/]*\.py$''',
]

[[allowlists]]
description = "Scanner bookkeeping files (redacted reports and baselines)"
paths = [
  '''(^|/)\.gitleaks-baseline\.json$''',
  '''(^|/)\.secret-scans/''',
  '''(^|/)gitleaks-report[^/]*\.(json|sarif)$''',
]
